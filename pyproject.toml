[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-console"
version = "1.2"
description = "A command-driven Linux terminal information interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
]

[project.scripts]
aqwhelper = "linux_console.app:main"
linux-console = "linux_console.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linux_console = ["VERSION"]
